<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>皇室战争 · 免费奖励 / Clash Royale Free Rewards</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
:root{
    --gold-1:#f9c05a;
    --gold-2:#e08a1e;
    --gold-soft:#fef6e7;
    --ink:#0f172a;
    --ink-2:#334155;
    --muted:#64748b;
    --line:#e9eef6;
    --line-strong:#dbe4f0;
    --card:#ffffff;
    --ok:#15803d;
    --ok-bg:#e7f7ee;
    --no:#c0392b;
    --no-bg:#fdeceb;
    --blue:#2563eb;
    --blue-bg:#eff5ff;
    --radius:22px;
    --shadow-sm:0 1px 2px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.04);
    --shadow-md:0 2px 6px rgba(15,23,42,.04), 0 18px 40px rgba(15,23,42,.07);
}

*{margin:0;padding:0;box-sizing:border-box;}

html{scroll-behavior:smooth;}

body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;
    padding:2.2rem 1.5rem 3rem;
    color:var(--ink);
    background:
        radial-gradient(1100px 520px at 85% -12%, rgba(249,192,90,.20), transparent 62%),
        radial-gradient(900px 480px at -5% 5%, rgba(37,99,235,.10), transparent 58%),
        #f5f7fc;
    -webkit-font-smoothing:antialiased;
}

.container{max-width:1360px;margin:0 auto;}

/* ---------- HERO ---------- */
.hero{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:26px;
    padding:1.7rem 1.9rem;
    margin-bottom:1.4rem;
    box-shadow:var(--shadow-md);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1.5rem;
    flex-wrap:wrap;
    overflow:hidden;
}
.hero::after{
    content:"";
    position:absolute;
    right:-80px;top:-120px;
    width:300px;height:300px;
    background:radial-gradient(circle, rgba(249,192,90,.16), transparent 65%);
    pointer-events:none;
}
.hero-left{display:flex;align-items:center;gap:1.1rem;min-width:0;}
.crown{
    flex:none;
    width:58px;height:58px;
    border-radius:18px;
    display:grid;place-items:center;
    font-size:1.55rem;
    color:#fff;
    background:linear-gradient(140deg,var(--gold-1),var(--gold-2));
    box-shadow:0 10px 22px rgba(224,138,30,.32);
}
.hero h1{
    font-size:1.95rem;
    font-weight:800;
    letter-spacing:-.02em;
    line-height:1.2;
    background:linear-gradient(135deg,#b87500,#f5b042 55%,#e08a1e);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
}
.sub{
    color:var(--muted);
    margin-top:.45rem;
    font-weight:500;
    font-size:.92rem;
    line-height:1.5;
}
.hero-right{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap;z-index:1;}

/* ---------- LANGUAGE SWITCH ---------- */
.lang-switch{
    display:inline-flex;
    background:#f1f5fb;
    border:1px solid var(--line-strong);
    border-radius:999px;
    padding:4px;
    gap:2px;
}
.lang-switch button{
    border:0;
    background:transparent;
    font-family:inherit;
    font-size:.82rem;
    font-weight:700;
    letter-spacing:.02em;
    color:var(--muted);
    padding:7px 16px;
    border-radius:999px;
    cursor:pointer;
    transition:.25s;
    display:inline-flex;align-items:center;gap:6px;
}
.lang-switch button:hover{color:var(--ink-2);}
.lang-switch button.active{
    background:#fff;
    color:var(--gold-2);
    box-shadow:0 1px 3px rgba(15,23,42,.10);
}

/* ---------- STATS ---------- */
.stats{display:flex;gap:.55rem;flex-wrap:wrap;}
.stat{
    display:inline-flex;align-items:center;gap:7px;
    background:#f8fafc;
    border:1px solid var(--line);
    border-radius:999px;
    padding:8px 15px;
    font-size:.82rem;
    font-weight:700;
    color:var(--ink-2);
    cursor:pointer;
    transition:.2s;
    user-select:none;
}
.stat:hover{transform:translateY(-1px);border-color:var(--line-strong);}
.stat .n{
    font-size:.95rem;
    font-weight:800;
    color:var(--ink);
}
.stat.active{background:var(--gold-soft);border-color:#f6dca8;color:#8a5a00;}
.stat.active .n{color:var(--gold-2);}
.stat i{font-size:.75rem;opacity:.8;}

/* ---------- TOOLBAR ---------- */
.toolbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:1rem;flex-wrap:wrap;
    margin-bottom:1rem;
    padding:0 .3rem;
}
.search{
    position:relative;
    flex:1 1 260px;
    max-width:340px;
}
.search i{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    color:#94a3b8;font-size:.82rem;pointer-events:none;
}
.search input{
    width:100%;
    font-family:inherit;
    font-size:.86rem;
    color:var(--ink);
    padding:11px 14px 11px 36px;
    border:1px solid var(--line-strong);
    border-radius:14px;
    background:#fff;
    outline:none;
    transition:.2s;
    box-shadow:var(--shadow-sm);
}
.search input:focus{border-color:#f3cf8e;box-shadow:0 0 0 3px rgba(249,192,90,.18);}
.search input::placeholder{color:#a3aec0;}

/* ---------- TABLE ---------- */
.rewards-grid{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow-md);
    overflow:hidden;
}
.table-scroll{overflow-x:auto;}
.reward-table{
    width:100%;
    min-width:900px;
    border-collapse:collapse;
    font-size:.88rem;
}
.reward-table th:nth-child(1),.reward-table td:nth-child(1){width:22%;text-align:left;}
.reward-table th:nth-child(2),.reward-table td:nth-child(2){width:24%;}
.reward-table th:nth-child(3),.reward-table td:nth-child(3){width:10%;}
.reward-table th:nth-child(4),.reward-table td:nth-child(4){width:16%;}
.reward-table th:nth-child(5),.reward-table td:nth-child(5){width:15%;}
.reward-table th:nth-child(6),.reward-table td:nth-child(6){width:13%;}

.reward-table th,.reward-table td{
    vertical-align:middle;
    padding:1.05rem .9rem;
    text-align:center;
}
.reward-table th{
    position:sticky;top:0;z-index:3;
    background:rgba(250,252,255,.94);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    font-size:.72rem;
    font-weight:800;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:#7b8798;
    border-bottom:1px solid var(--line-strong);
    padding:.95rem .9rem;
    white-space:nowrap;
}
.reward-table td{border-bottom:1px solid #f2f5f9;color:var(--ink-2);}
.reward-table tbody tr{transition:background .18s ease;}
.reward-table tbody tr:hover{background:linear-gradient(90deg,#fffbf2,#fff);}
.reward-table tbody tr:last-child td{border-bottom:0;}
.reward-table tbody tr.row-expired .reward-name{color:#9aa6b6;}
.reward-table tbody tr.row-expired .preview-gallery{opacity:.55;filter:grayscale(.35);}

.reward-name{
    font-weight:700;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:9px;
    font-size:.9rem;
    line-height:1.35;
}
.reward-name i{color:var(--gold-1);font-size:.85rem;flex:none;}

.preview-gallery{
    display:flex;flex-wrap:wrap;
    justify-content:center;align-items:center;gap:8px;
}
.preview-img{
    width:60px;height:60px;
    object-fit:contain;
    border-radius:14px;
    background:linear-gradient(180deg,#fbfcfe,#f3f6fb);
    border:1px solid #eef2f8;
    padding:4px;
    cursor:zoom-in;
    transition:transform .2s ease, box-shadow .2s ease;
}
.preview-img:hover{transform:translateY(-2px) scale(1.06);box-shadow:0 8px 18px rgba(15,23,42,.12);}
.preview-placeholder{
    width:60px;height:60px;
    display:inline-flex;align-items:center;justify-content:center;
    background:var(--gold-soft);
    border-radius:16px;
    font-size:1.5rem;
    color:var(--gold-1);
}

.type-badge{
    display:inline-block;
    padding:4px 12px;
    border-radius:999px;
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.01em;
    background:var(--blue-bg);
    color:var(--blue);
    white-space:nowrap;
}
.type-badge.t-shop{background:#f4f1fe;color:#7c3aed;}

.link-cell a{
    display:inline-flex;align-items:center;gap:6px;
    color:var(--blue);
    text-decoration:none;
    font-size:.82rem;
    font-weight:600;
    padding:7px 14px;
    border-radius:11px;
    border:1px solid #dbe8ff;
    background:#f7faff;
    transition:.2s;
    white-space:nowrap;
}
.link-cell a:hover{
    background:linear-gradient(135deg,var(--gold-1),var(--gold-2));
    border-color:transparent;
    color:#fff;
    box-shadow:0 6px 16px rgba(224,138,30,.28);
}
.link-cell .no-link{
    display:inline-flex;align-items:center;gap:6px;
    color:#9aa6b6;font-size:.78rem;font-weight:600;
    padding:7px 12px;border-radius:11px;background:#f7f9fc;
    white-space:nowrap;
}

.expiry{display:inline-flex;flex-direction:column;align-items:center;gap:3px;line-height:1.3;}
.expiry .date{font-weight:600;font-size:.85rem;color:var(--ink-2);white-space:nowrap;}
.expiry .date i{color:#b6c0ce;margin-right:5px;font-size:.78rem;}
.expiry .left{
    font-size:.7rem;font-weight:700;color:var(--gold-2);
    background:var(--gold-soft);padding:2px 9px;border-radius:999px;white-space:nowrap;
}

.status-badge{
    display:inline-flex;align-items:center;gap:7px;
    padding:6px 14px;
    border-radius:999px;
    font-weight:700;
    font-size:.76rem;
    background:#f1f5f9;
    color:var(--ink-2);
    white-space:nowrap;
}
.status-badge.available{background:var(--ok-bg);color:var(--ok);}
.status-badge.expired{background:var(--no-bg);color:var(--no);}

.empty{
    padding:3.5rem 1rem;text-align:center;color:var(--muted);
}
.empty i{font-size:2rem;color:#dbe4f0;display:block;margin-bottom:.7rem;}

/* ---------- FOOTER ---------- */
footer{
    margin-top:1.6rem;
    text-align:center;
    font-size:.76rem;
    color:#8794a6;
    line-height:1.8;
    padding:0 1rem;
}
footer a{color:var(--gold-2);text-decoration:none;font-weight:600;border-bottom:1px dashed #f0c98a;}
footer a:hover{color:#b87500;}
footer .foot-ico{color:#cfd8e5;margin-right:6px;}

/* ---------- LIGHTBOX ---------- */
.lightbox{
    position:fixed;inset:0;z-index:99;
    background:rgba(9,15,28,.82);
    backdrop-filter:blur(6px);
    display:none;
    align-items:center;justify-content:center;
    padding:2rem;
    cursor:zoom-out;
}
.lightbox.show{display:flex;animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.lightbox img{
    max-width:min(90vw,460px);max-height:80vh;
    border-radius:20px;background:#fff;padding:18px;
    box-shadow:0 30px 80px rgba(0,0,0,.45);
}
.lightbox .lb-close{
    position:absolute;top:22px;right:26px;
    width:42px;height:42px;border-radius:50%;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.10);
    color:#fff;font-size:1.1rem;cursor:pointer;
}

/* ---------- RESPONSIVE ---------- */
@media (min-width:861px){
    .preview-img{width:72px;height:72px;}
    .preview-placeholder{width:72px;height:72px;font-size:1.75rem;}
}
@media (max-width:860px){
    body{padding:1rem .75rem 2rem;}
    .hero{padding:1.3rem 1.2rem;border-radius:22px;}
    .hero h1{font-size:1.4rem;}
    .crown{width:48px;height:48px;font-size:1.25rem;border-radius:15px;}
    .table-scroll{overflow:visible;}
    .reward-table{min-width:0;}
    .reward-table thead{display:none;}
    .reward-table,.reward-table tbody,.reward-table tr,.reward-table td{display:block;width:auto;}
    .reward-table tbody tr{
        border:1px solid var(--line);
        border-radius:18px;
        margin:.75rem;
        padding:.35rem .95rem;
        background:#fff;
        box-shadow:var(--shadow-sm);
    }
    .reward-table td{
        display:flex;align-items:center;justify-content:space-between;
        gap:1rem;text-align:right;padding:.6rem 0;
        border-bottom:1px dashed #eef2f8;
    }
    .reward-table tbody tr td:last-child{border-bottom:0;padding-bottom:.7rem;}
    .reward-table td::before{
        content:attr(data-label);
        font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
        color:#98a4b4;text-align:left;flex:none;
    }
    .reward-table td:nth-child(1){padding-top:.9rem;}
    .reward-table td:nth-child(2),.reward-table td:nth-child(1){justify-content:flex-start;}
    .reward-name{text-align:left;}
    .toolbar{padding:0;}
    .search{max-width:none;}
    .stats{width:100%;}
    .stat{flex:1;justify-content:center;}
}
</style>
</head>

/* ================= HELPERS ================= */
const t = k => I18N[LANG][k];
const nameOf = r => (LANG === 'en' ? (r.en || r.name) : r.name);

function getRewardType(link){
    if(!link) return '';
    if(link.includes('action=voucher')) return t('type_link');
    if(link.includes('storeCode'))      return t('type_code');
    if(link.includes('onlineshop'))     return t('type_shop');
    return '';
}
function getTypeClass(link){
    if(link && link.includes('onlineshop')) return ' t-shop';
    return '';
}
function getStatusInfo(status){
    return status === 'available'
        ? {text:t('status_available'), icon:'fa-circle-check', cls:'available'}
        : {text:t('status_expired'),   icon:'fa-calendar-xmark', cls:'expired'};
}
function parseImageList(field){
    if(!field) return [];
    return String(field).split(',').map(s => s.trim()).filter(Boolean);
}
function remainingLabel(expiryText, status){
    if(status !== 'available') return '';
    if(LANG === 'en' && expiryText === '未知') return '';
    const m = /^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})$/.exec(expiryText || '');
    if(!m) return '';
    const diff = new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5]) - new Date();
    if(!(diff > 0)) return '';
    const days  = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    return days > 0 ? t('daysLeft')(days) : t('hoursLeft')(hours);
}
function formatExpiry(text){
    if(!text) return '';
    if(text === '未知') return t('unknown');
    if(LANG === 'en'){
        return text.replace(/^(\d{4})-(\d{2})-(\d{2})/, '$2/$3/$1');
    }
    return text;
}

/* ================= RENDER ================= */
function createImageElement(src, alt){
    const img = document.createElement('img');
    img.src = src;
    img.alt = alt;
    img.className = 'preview-img';
    img.loading = 'lazy';
    img.addEventListener('click', () => openLightbox(src, alt));
    img.onerror = function(){
        if(img.parentNode && !img.parentNode.querySelector('.preview-placeholder')){
            const ph = document.createElement('div');
            ph.className = 'preview-placeholder';
            ph.innerHTML = '<i class="fas fa-chess-board"></i>';
            img.style.display = 'none';
            img.parentNode.appendChild(ph);
        }
        img.onerror = null;
    };
    return img;
}

function renderStats(){
    const box = document.getElementById('stats');
    const all = REWARDS_DATA.length;
    const av  = REWARDS_DATA.filter(r => r.status === 'available').length;
    const defs = [
        {key:'all',       n:all,        label:t('stat_all'),       icon:'fa-layer-group'},
        {key:'available', n:av,         label:t('stat_available'), icon:'fa-circle-check'},
        {key:'expired',   n:all - av,   label:t('stat_expired'),   icon:'fa-calendar-xmark'}
    ];
    box.innerHTML = defs.map(d => `
        <div class="stat${FILTER === d.key ? ' active' : ''}" data-filter="${d.key}">
            <i class="fas ${d.icon}"></i>${d.label}<span class="n">${d.n}</span>
        </div>`).join('');
    box.querySelectorAll('.stat').forEach(el => {
        el.addEventListener('click', () => { FILTER = el.dataset.filter; renderStats(); renderTable(); });
    });
}

function renderTable(){
    const tbody = document.getElementById('rewardTableBody');
    const empty = document.getElementById('emptyState');
    tbody.innerHTML = '';

    const kw = KEYWORD.trim().toLowerCase();
    const list = REWARDS_DATA.filter(r => {
        if(FILTER !== 'all' && r.status !== FILTER) return false;
        if(!kw) return true;
        return (r.name + ' ' + (r.en || '')).toLowerCase().includes(kw);
    });

    list.forEach(reward => {
        const st = getStatusInfo(reward.status);
        const tr = document.createElement('tr');
        if(reward.status === 'expired') tr.className = 'row-expired';

        const tdName = document.createElement('td');
        tdName.dataset.label = t('th_reward');
        tdName.innerHTML = `<div class="reward-name"><i class="fas fa-chest"></i><span>${nameOf(reward)}</span></div>`;

        const tdPreview = document.createElement('td');
        tdPreview.dataset.label = t('th_preview');
        const gallery = document.createElement('div');
        gallery.className = 'preview-gallery';
        const paths = parseImageList(reward.imgSrc);
        if(paths.length === 0){
            gallery.innerHTML = '<div class="preview-placeholder"><i class="fas fa-image"></i></div>';
        }else{
            paths.forEach(src => gallery.appendChild(createImageElement(src, nameOf(reward))));
        }
        tdPreview.appendChild(gallery);

        const tdType = document.createElement('td');
        tdType.dataset.label = t('th_type');
        tdType.innerHTML = `<span class="type-badge${getTypeClass(reward.link)}">${getRewardType(reward.link) || '—'}</span>`;

        const tdLink = document.createElement('td');
        tdLink.className = 'link-cell';
        tdLink.dataset.label = t('th_link');
        if(reward.link && reward.link !== 'onlineshop'){
            tdLink.innerHTML = `<a href="${reward.link}" target="_blank" rel="noopener noreferrer"><i class="fas fa-arrow-up-right-from-square"></i> ${t('claim')}</a>`;
        }else{
            tdLink.innerHTML = `<span class="no-link"><i class="fas fa-store"></i> ${t('shopOnly')}</span>`;
        }

        const tdExpiry = document.createElement('td');
        tdExpiry.dataset.label = t('th_expiry');
        const left = remainingLabel(reward.expiryText, reward.status);
        tdExpiry.innerHTML = `<div class="expiry">
            <span class="date"><i class="far fa-calendar"></i>${formatExpiry(reward.expiryText)}</span>
            ${left ? `<span class="left">${left}</span>` : ''}
        </div>`;

        const tdStatus = document.createElement('td');
        tdStatus.dataset.label = t('th_status');
        tdStatus.innerHTML = `<div class="status-badge ${st.cls}"><i class="fas ${st.icon}"></i> ${st.text}</div>`;

        [tdName, tdPreview, tdType, tdLink, tdExpiry, tdStatus].forEach(td => tr.appendChild(td));
        tbody.appendChild(tr);
    });

    empty.style.display = list.length ? 'none' : 'block';
    document.getElementById('emptyText').textContent = t('empty');
}

function renderStatic(){
    document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-CN';
    document.title = t('docTitle');
    document.getElementById('pageTitle').textContent = t('title');
    document.getElementById('pageSub').textContent = t('sub');
    document.getElementById('searchInput').placeholder = t('search');

    document.querySelectorAll('.reward-table th').forEach(th => {
        th.textContent = t('th_' + th.dataset.th);
    });

    document.getElementById('footText1').textContent = t('foot1');
    const foot2 = document.getElementById('footText2');
    foot2.innerHTML = t('foot2a') +
        `<a id="switchAccountLink" href="#" target="_blank" rel="noopener noreferrer">${t('foot2b')}</a>` +
        t('foot2c');
    const switchLink = document.getElementById('switchAccountLink');
    if(switchLink && SWITCH_ACCOUNT_URL && SWITCH_ACCOUNT_URL !== '#') switchLink.href = SWITCH_ACCOUNT_URL;

    document.querySelectorAll('#langSwitch button').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === LANG);
    });
}

function renderAll(){ renderStatic(); renderStats(); renderTable(); }

/* ================= LIGHTBOX ================= */
const lightbox = document.getElementById('lightbox');
function openLightbox(src, alt){
    const img = lightbox.querySelector('img');
    img.src = src; img.alt = alt;
    lightbox.classList.add('show');
}
function closeLightbox(){ lightbox.classList.remove('show'); }
lightbox.addEventListener('click', closeLightbox);
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeLightbox(); });

/* ================= INIT ================= */
document.addEventListener('DOMContentLoaded', () => {
    try{
        const saved = localStorage.getItem('crRewardLang');
        if(saved === 'zh' || saved === 'en') LANG = saved;
    }catch(e){}

    document.getElementById('langSwitch').addEventListener('click', e => {
        const btn = e.target.closest('button[data-lang]');
        if(!btn) return;
        LANG = btn.dataset.lang;
        try{ localStorage.setItem('crRewardLang', LANG); }catch(err){}
        renderAll();
    });

    let timer = null;
    document.getElementById('searchInput').addEventListener('input', e => {
        clearTimeout(timer);
        const v = e.target.value;
        timer = setTimeout(() => { KEYWORD = v; renderTable(); }, 150);
    });

    renderAll();
});
